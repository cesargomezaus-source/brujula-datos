name: fund
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fund:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar fund.json
        run: python3 -I build_data.py --fund data/fund.json
      - name: Generar check.json
        run: python3 -I build_data.py --check data/check.json
      - name: Verificar afirmaciones
        run: python3 -I verify_claims.py claims.json data/claims_check.json
      - name: Publicar si cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fund.json data/check.json data/claims_check.json
          git diff --staged --quiet || git commit -m "Actualizar fund.json, check.json y claims_check.json"
          git push
